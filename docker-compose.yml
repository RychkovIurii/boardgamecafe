services:
  mongo:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - project=cafeboardgame
    expose:
      - "27017"
    volumes:
      - ./mongo/db_mounted:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cafe-network

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    labels:
      - project=cafeboardgame
    restart: "no"
    env_file:
      - ./docker.env
    entrypoint: ["/bin/sh", "-c", "npm run seed && npm run seedMenu"]
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - cafe-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    labels:
      - project=cafeboardgame
    restart: unless-stopped
    env_file:
      - ./docker.env
    expose:
      - "5000"
    depends_on:
      seed:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    networks:
      - cafe-network

  frontend:
    build:
      context: .
      dockerfile: frontend/cafe-front/Dockerfile
    labels:
      - project=cafeboardgame
    restart: unless-stopped
    env_file:
      - ./docker.env
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - cafe-network

  nginx:
    image: nginx:1.29-alpine
    labels:
      - project=cafeboardgame
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cafe-network

networks:
  cafe-network:
    driver: bridge
    labels:
      - project=cafeboardgame
